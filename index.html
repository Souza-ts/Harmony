<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Now Playing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="player" id="player">
    <img id="cover" />
    <h1 id="title">Nada tocando</h1>
    <h2 class="meta">
     <span id="artist"></span>
     <span class="dot">•</span>
     <span id="album"></span>
</h2>

    <div class="progress">
      <span id="current">0:00</span>
      <div class="bar">
        <div id="fill"></div>
      </div>
      <span id="duration">0:00</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
